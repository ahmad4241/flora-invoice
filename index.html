<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فاتورة فلورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one A4 sheet, RTL, brand band at top, items table, totals card bottom-left */
:root{
  --paper:#ffffff; --desk:#eef1ec; --ink:#1f2a22; --muted:#6b776e;
  --green:#355a3a; --green-2:#4c7a52; --mint:#e9f0e8; --plum:#5e3a6b; --line:#dfe5dd;
  --f:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f);padding-inline:16px;padding-block:20px 40px}
.tools{max-width:794px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tools .grp{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:var(--f);font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--green-2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
button.on{background:var(--green);color:#fff;border-color:var(--green)}
.hint{font-size:12px;color:var(--muted)}

.stage{max-width:794px;margin:0 auto;position:relative}
.sheet{width:794px;height:1123px;transform-origin:top right;position:absolute;top:0;right:0;background:var(--paper);box-shadow:0 10px 40px rgba(40,60,40,.12);overflow:hidden;padding:44px 48px 30px;display:flex;flex-direction:column;gap:28px}
.size-tag{max-width:794px;margin:0 auto 8px;font-size:11px;color:var(--muted);text-align:center}
.sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--green) 0 82%,var(--plum) 82% 100%)}
.leaf{position:absolute;top:56%;left:50%;width:360px;transform:translate(-50%,-50%);opacity:.08;pointer-events:none;z-index:0}
.sheet>header,.sheet>section,.sheet>footer{position:relative;z-index:1}

.head{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.brand{display:flex;gap:18px;align-items:center}
.brand img{height:118px;width:auto}
.biz{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);line-height:1.6}
.biz b{color:var(--ink);font-weight:500;direction:ltr;unicode-bidi:isolate}
.title{text-align:end;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.title h1{margin:0;font-size:30px;font-weight:700;color:var(--green);letter-spacing:.5px}
.title .en{font-size:13px;letter-spacing:5px;color:var(--plum);font-weight:600}
.date{margin-top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}

.lbl{font-size:11px;font-weight:600;color:var(--green);letter-spacing:.3px}
.lbl i{font-style:normal;color:var(--muted);font-weight:400;letter-spacing:1.2px;font-size:10px;margin-inline-start:6px}

input,textarea{font-family:var(--f);font-size:14px;color:var(--ink);border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 2px;width:100%;border-radius:0}
input:hover,textarea:hover{border-bottom-color:var(--green-2)}
.dpick{position:relative;display:inline-block;font-size:15px;font-weight:500;padding:4px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
@media print{.dpick{border-color:transparent}}
input.num{text-align:center;font-variant-numeric:tabular-nums}

.client{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:0 26px}
.party{display:flex;flex-direction:column;gap:12px;min-width:0}
.ptop{display:flex;align-items:center;gap:14px}
.ctile{flex:none;width:58px;height:58px;border-radius:14px;background:var(--mint);display:grid;place-items:center}
.ctile svg{width:28px;height:28px}
.ctile img{width:30px;height:auto}
.pname{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pname .n{font-size:20px;font-weight:700;padding:2px;line-height:1.3}
.from{gap:8px}
.fname{font-size:16px;font-weight:600;color:var(--ink)}
.fname em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:1px;margin-inline-start:4px}
.contact{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--muted);line-height:1.5}
.contact li{display:flex;gap:8px;align-items:flex-start}
.contact svg{flex:none;width:15px;height:15px;margin-top:2px;fill:none;stroke:var(--green);stroke-width:1.7;stroke-linejoin:round}
.contact span[dir=ltr]{color:var(--ink);font-weight:500;letter-spacing:.5px}
.divider{display:flex;flex-direction:column;align-items:center;gap:8px}
.divider span{flex:1;width:1px;background:var(--line)}
.divider .ctile{width:54px;height:54px}
.to{gap:8px}
.cname{font-size:16px;font-weight:600;padding:2px}
.contact li input{font-size:12.5px;padding:1px 2px;color:var(--ink)}
.vline{background:var(--line)}
.drow{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:8px}
.drow .k{font-size:13px;font-weight:600;color:var(--green);line-height:1.2}
.drow .k small{display:block;font-size:9.5px;letter-spacing:1.2px;color:var(--muted);font-weight:400}
.drow .v{font-size:14px;font-weight:500;padding:4px 2px;min-height:28px;line-height:1.5}
.lbl.big{font-size:12px;letter-spacing:.5px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
thead th{background:var(--green);color:#fff;font-weight:500;font-size:12.5px;padding:11px 10px;text-align:center;line-height:1.35}
thead th small{display:block;font-size:9.5px;letter-spacing:1.2px;opacity:.75;font-weight:400}
thead th:first-child{border-start-start-radius:10px;border-end-start-radius:10px;width:44px}
thead th:last-child{border-start-end-radius:10px;border-end-end-radius:10px;width:40px}
thead th.item{text-align:start}
tbody td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
tbody tr:nth-child(even) td{background:#fafbf9}
td.idx{color:var(--muted)}
td.tot{font-weight:600;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;padding:2px 8px;line-height:1}
.del:hover{color:var(--plum)}
.add{margin-top:10px;border-style:dashed;color:var(--green);background:transparent}

.bottom{display:flex;gap:28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.notes{flex:1 1 260px;display:flex;flex-direction:column;gap:6px;min-width:0}
textarea{resize:vertical;min-height:70px;border:1px dashed var(--line);border-radius:10px;padding:10px}
.sum{flex:0 1 320px;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.row span:first-child small{color:var(--muted);font-size:10px;letter-spacing:1px;margin-inline-start:6px}
.row input{width:110px;text-align:end;font-weight:500}
.row.total{background:var(--green);color:#fff;border:0;padding:16px 18px}
.row.total small{color:#cfe0cf!important}
.row.total strong{font-size:20px}

.foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot .thanks{color:var(--green);font-weight:500}
.foot .thanks em{font-style:normal;color:var(--plum)}

@media print{
  body{background:#fff;padding:0}
  .tools,.del,.add,.noprint{display:none!important}
  .stage{max-width:none;height:auto!important}
  html,body{height:auto}
  .sheet{position:static;transform:none!important;box-shadow:none;width:100%;height:auto;min-height:0;padding:20px 30px 12px;gap:16px;overflow:visible;zoom:.84}
  .client{padding:16px 0}
  .brand img{height:96px}
  .brand .logo-en img{height:66px}
  .head,.client,table,tr,.bottom,.sum,.foot{break-inside:avoid;page-break-inside:avoid}
  .notes.empty textarea{display:none}
  .leaf{top:50%}
  .sheet>footer.foot{position:fixed;left:30px;right:30px;bottom:6px;margin:0;background:#fff;z-index:2}
  .sheet{padding-bottom:70px}
  .size-tag{display:none}
  @page{size:A4;margin:0}
  input,textarea{border-color:transparent!important}
  textarea{resize:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.client .party{gap:0}
.client .lbl.big{height:22px;display:flex;align-items:center}
.client .pn{display:flex;align-items:baseline;gap:6px;height:36px;line-height:36px;font-size:18px;font-weight:600;color:var(--ink);padding:0;margin-bottom:6px}
.client .pn em{font-style:normal;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:1.5px}
.client .contact{gap:4px;margin:0}
.client .contact li{height:26px;align-items:center;gap:9px}
.client .contact svg{margin:0}
.client .ph,.client .ad{font-family:var(--f);font-size:13px;line-height:26px;height:26px;padding:0;border:0}
.client .ph{color:var(--ink);font-weight:500;letter-spacing:.6px}
.client .ad{color:var(--muted);font-weight:400}
.client input{border-bottom:1px dashed transparent;width:100%}
.client input:placeholder-shown{border-bottom-color:var(--line)}
.client input:hover,.client input:focus{border-bottom-color:var(--green-2)}
.client input::placeholder{color:#a9b3aa}
.divider .ctile{width:52px;height:52px}
@media print{.client input{border-color:transparent!important}}
.client .to{justify-self:center;width:min(100%,250px)}
.client .to .ad{color:var(--ink)}
.client .from{justify-self:center;width:fit-content;max-width:100%}
.client .from .contact li:last-child{height:auto;align-items:flex-start}
.client .from .contact li:last-child svg{margin-top:5px}
.client .from .ad{height:auto;line-height:1.7;padding-top:2px}
[dir=ltr] .client input{text-align:left!important}
[dir=ltr] .ar-only{display:none}
.langbtn{font-weight:600;color:var(--plum);border-color:var(--plum)}
.logo-en{display:none;flex-direction:column;align-items:center;gap:6px}
.brand .logo-en img{height:82px}
.logo-en span{font-family:var(--f);font-weight:500;font-size:27px;letter-spacing:3px;color:var(--green);line-height:1}
.sheet[dir=ltr] .logo-ar{display:none}
.sheet[dir=ltr] .logo-en{display:flex}
/* align title block to logo height */
.head{align-items:stretch}
.title{justify-content:space-between;padding-block:2px 4px}
.title h1{line-height:1.1}
.date{margin-top:0}
.printbtn{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.printbtn:hover{background:var(--green-2)}
@media print{::placeholder{color:transparent!important}.notes.empty{visibility:hidden}}
.tools button{font-size:12px;padding:6px 12px;border-radius:7px}
.tools .grp{gap:5px}
a[href^="tel"],a[href^="mailto"],a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font:inherit!important}
.pv{position:fixed;inset:0;z-index:50;background:rgba(20,30,22,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.pv[hidden]{display:none}
.pv-box{background:#fff;border-radius:16px;width:min(100%,460px);max-height:100%;display:flex;flex-direction:column;gap:12px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:var(--f)}
.pv-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pv-head b{font-size:15px;color:var(--green)}
.pv-page{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#f6f7f5;display:flex;justify-content:center}
.pv-page img{width:100%;height:auto;display:block}
.pv-go{width:100%;padding:13px;font-size:15px;border-radius:10px}
@media print{.pv{display:none!important}}
</style>
</head>
<body>


<div class="tools" dir="rtl">
  <div class="grp">
    <button id="lang" type="button" class="langbtn">English</button>
    <button id="cur-iqd" class="on" type="button" >IQD</button>
    <button id="cur-usd" type="button" >USD</button>
  </div>
  <div class="grp">
    <button id="print" type="button" class="printbtn" >PDF</button>
    <button id="clear" type="button" >New</button>
    <button id="confirmClear" type="button" hidden style="border-color:var(--plum);color:var(--plum)" data-en="Clear all?">مسح الكل؟</button>
  </div>
</div>

        <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.9-6 7.5-6s6.7 2.2 7.5 6"/></svg><input autocomplete="off" id="c-person" class="ad" placeholder="اسم الشخص الموجّه إليه" data-en-ph="Attention: contact person"></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input autocomplete="off" id="c-email" class="ad" type="email" dir="ltr" style="text-align:right" placeholder="email@example.com"></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h2.6l1.4 4-2 1.3a11 11 0 0 0 6.6 6.6l1.3-2 4 1.4v2.6a1.6 1.6 0 0 1-1.7 1.6A16.5 16.5 0 0 1 5 5.2a1.6 1.6 0 0 1 1.6-1.7z"/></svg><input autocomplete="off" id="c-phone" class="ph" inputmode="tel" dir="ltr" style="text-align:right" placeholder="07xx xxx xxxx"></li>
      </ul>
    </div>
  </section>

  <section>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>#</th>
          <th class="item"><span data-en="Item / Service">المادة / الخدمة</span></th>
          <th><span data-en="Qty">الكمية</span></th>
          <th><span data-en="Unit price">سعر المفرد</span></th>
          <th><span data-en="Total">المجموع</span></th>
          <th><span class="noprint"></span></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <button class="add" id="add" type="button" data-en="+ Add item">+ إضافة مادة</button>
  </section>

  <section class="bottom">
    <div class="notes">
      <span class="lbl"><span data-en="Notes">ملاحظات</span></span>
      <textarea autocomplete="off" id="notes" placeholder="أي ملاحظة للزبون…" data-en-ph="Any note for the customer…"></textarea>
    </div>
    <div class="sum">
      <div class="row"><span data-en="Subtotal">المجموع</span><span id="sub">0</span></div>
      <div class="row"><span data-en="Discount">الخصم</span><input autocomplete="off" id="disc" class="num" inputmode="decimal" value="0"></div>
      <div class="row total"><span data-en="Total">الإجمالي</span><strong id="total">0</strong></div>
    </div>
  </section>

  <footer class="foot">
    <span class="thanks ar-only">شكراً لاختياركم فلورا</span>
    <span class="thanks en" dir="ltr"><em>Thank you for choosing Flora</em></span>
  </footer>
</main>
</div>

<div id="pv" class="pv" hidden>
  <div class="pv-box" role="dialog" aria-modal="true" aria-labelledby="pv-title">
    <div class="pv-head"><b id="pv-title">الفاتورة جاهزة</b><button id="pv-close" type="button">إغلاق</button></div>
    <div class="pv-page"><img id="pv-img" alt=""></div>
    <button id="pv-share" type="button" class="printbtn pv-go">طباعة / مشاركة</button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  let cur='IQD';
  const sample=[["باقة ورد جوري",1,35000],["تنسيق سلة هدايا",1,50000],["كرت إهداء",2,2500]];
  const n=v=>{v=String(v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,،\s]/g,'');const x=parseFloat(v);return isNaN(x)?0:x};
  const fmt=x=>cur==='IQD'
    ? Math.round(x).toLocaleString('en-US')+(EN?' IQD':' د.ع')
    : '$'+(Math.round(x*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
  function addRow(d=["",1,""]){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="idx"></td>
      <td style="text-align:start"><input autocomplete="off" class="it" placeholder="${EN?'Item name':'اسم المادة'}"></td>
      <td style="width:80px"><input autocomplete="off" class="num q" inputmode="decimal"></td>
      <td style="width:130px"><input autocomplete="off" class="num p" inputmode="decimal" placeholder="0"></td>
      <td class="tot"></td>
      <td><button class="del" type="button" aria-label="حذف">×</button></td>`;
    tr.querySelector('.it').value=d[0];tr.querySelector('.q').value=d[1];tr.querySelector('.p').value=d[2];
    tr.querySelector('.del').onclick=()=>{tr.remove();calc()};
    $('rows').appendChild(tr);calc();
  }
  function calc(){
    let s=0;[...$('rows').children].forEach((tr,i)=>{
      tr.querySelector('.idx').textContent=i+1;
      const t=n(tr.querySelector('.q').value)*n(tr.querySelector('.p').value);s+=t;
      tr.querySelector('.tot').textContent=t?fmt(t):'—';
    });
    $('sub').textContent=fmt(s);
    $('total').textContent=fmt(Math.max(0,s-n($('disc').value)));
  }
  const notesState=()=>document.querySelector('.notes').classList.toggle('empty',!$('notes').value.trim());
  document.addEventListener('input',()=>{calc();notesState()});
  window.addEventListener('beforeprint',notesState);
  let EN=false;
  const PAIRS=[['شركة الأمل للتجارة','Al-Amal Trading Co.'],['أحمد علي','Ahmed Ali'],['باقة ورد جوري','Damask rose bouquet'],['تنسيق سلة هدايا','Gift basket arrangement'],['كرت إهداء','Gift card']];
  function swapValues(en){
    document.querySelectorAll('#c-name,#c-person,#rows .it,#notes').forEach(el=>{
      const p=PAIRS.find(x=>x[en?0:1]===el.value.trim());
      if(p)el.value=p[en?1:0];
    });
  }
  const cache=new Map();
  function setLang(en){
    EN=en;swapValues(en);
    document.querySelectorAll('[data-en]').forEach(el=>{
      if(!cache.has(el))cache.set(el,el.innerHTML);
      const v=en?el.dataset.en:cache.get(el);
      if(el.hasAttribute('data-html')||!en)el.innerHTML=v;else el.textContent=v;
    });
    document.querySelectorAll('[data-en-ph]').forEach(el=>{
      if(!el.dataset.arPh)el.dataset.arPh=el.placeholder;
      el.placeholder=en?el.dataset.enPh:el.dataset.arPh;
    });
    document.querySelectorAll('#rows .it').forEach(i=>i.placeholder=en?'Item name':'اسم المادة');
    $('sheet').dir=en?'ltr':'rtl';
    $('sheet').style.transformOrigin=en?'top left':'top right';
    $('sheet').style.right=en?'auto':'0';$('sheet').style.left=en?'0':'auto';
    $('lang').textContent=en?'عربي':'English';document.querySelector('.tools').dir=en?'ltr':'rtl';
    document.title=en?'Flora Invoice':'فاتورة فلورا';
    if($('dateTxt'))showDate();
    calc();
    try{localStorage.setItem('flora-lang',en?'en':'ar')}catch(e){}
  }
  $('lang').onclick=()=>setLang(!EN);
  // PDF: build a real A4 file (no browser header/footer, URL or date)
  const loadJS=src=>new Promise((ok,no)=>{if(document.querySelector('script[src="'+src+'"]'))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  let pdfFile=null,pdfURL=null;
  function showPDF(blob,name,img){
    if(pdfURL)URL.revokeObjectURL(pdfURL);
    pdfURL=URL.createObjectURL(blob);
    try{pdfFile=new File([blob],name,{type:'application/pdf'})}catch(e){pdfFile=null}
    $('pv-img').src=img;$('pv').dataset.name=name;
    $('pv-title').textContent=EN?'Invoice ready':'الفاتورة جاهزة';
    $('pv-share').textContent=EN?'Print / Share':'طباعة / مشاركة';
    $('pv-close').textContent=EN?'Close':'إغلاق';
    $('pv').dir=EN?'ltr':'rtl';
    $('pv').hidden=false;document.body.style.overflow='hidden';
  }
  function closePDF(){$('pv').hidden=true;document.body.style.overflow=''}
  async function sharePDF(){
    const name=$('pv').dataset.name;
    if(pdfFile&&navigator.canShare&&navigator.canShare({files:[pdfFile]})){
      try{await navigator.share({files:[pdfFile],title:name});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=pdfURL;a.download=name;document.body.appendChild(a);a.click();a.remove();
  }
  async function makePDF(){
    const btn=$('print'),label=btn.textContent;btn.disabled=true;btn.textContent='…';
    try{
      await Promise.all([loadJS('lib/html2canvas.min.js'),loadJS('lib/jspdf.umd.min.js')]);
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      notesState();
      const src=$('sheet');
      const fields=[...src.querySelectorAll('input,textarea')];
      const prevT=src.style.transform,sy=window.scrollY;src.style.transform='none';window.scrollTo(0,0);
      let canvas;
      try{canvas=await html2canvas(src,{scale:3,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:1123,scrollX:0,scrollY:0,
        onclone:(doc)=>{
          const sh=doc.getElementById('sheet');
          sh.style.transform='none';sh.style.position='relative';sh.style.left='0';sh.style.right='0';sh.style.boxShadow='none';
          const st=doc.createElement('style');
          st.textContent='.del,.add,.noprint{display:none!important}.dpick{border-color:transparent!important}.notes.empty{visibility:hidden}'+(EN?'':'#sheet *{letter-spacing:0!important}');
          doc.head.appendChild(st);
          const cl=[...sh.querySelectorAll('input,textarea')];
          cl.forEach((el,i)=>{
            const o=fields[i];if(!o)return;
            if(o.type==='date'){el.remove();return}
            const cs=getComputedStyle(o),sp=doc.createElement('div');
            sp.textContent=o.value;
            ['fontFamily','fontSize','fontWeight','color','textAlign','lineHeight','paddingTop','paddingBottom','paddingLeft','paddingRight','letterSpacing'].forEach(k=>sp.style[k]=cs[k]);
            sp.style.width=cs.width;sp.style.minHeight=cs.height;sp.style.boxSizing='border-box';sp.style.whiteSpace=o.tagName==='TEXTAREA'?'pre-wrap':'nowrap';
            sp.style.overflow='hidden';sp.style.direction=cs.direction;sp.className=el.className;sp.style.border='0';
            if(!EN)sp.style.letterSpacing='0';
            el.replaceWith(sp);
          });
        }});}
      finally{src.style.transform=prevT;fit();window.scrollTo(0,sy)}
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297);
      const d=$('date').value||new Date().toISOString().slice(0,10);
      const name='Flora-Invoice-'+d+'.pdf';
      const blob=pdf.output('blob');
      showPDF(blob,name,canvas.toDataURL('image/jpeg',0.8));
    }catch(e){console.error(e);alert(EN?'Could not create the PDF, please try again.':'ما قدرنا نعمل ملف PDF، جرّب مرة ثانية.')}
    finally{btn.disabled=false;btn.textContent=label}
  }
  $('print').onclick=makePDF;
  $('pv-share').onclick=sharePDF;$('pv-close').onclick=closePDF;
  $('pv').addEventListener('click',e=>{if(e.target===$('pv'))closePDF()});
  $('add').onclick=()=>addRow();
  function setCur(c){cur=c;$('cur-iqd').classList.toggle('on',c==='IQD');$('cur-usd').classList.toggle('on',c==='USD');calc()}
  $('cur-iqd').onclick=()=>setCur('IQD');$('cur-usd').onclick=()=>setCur('USD');
  $('clear').onclick=()=>{$('clear').hidden=true;$('confirmClear').hidden=false;setTimeout(()=>{$('clear').hidden=false;$('confirmClear').hidden=true},3000)};
  $('confirmClear').onclick=()=>{
    ['c-name','c-person','c-email','c-phone','notes'].forEach(i=>$(i).value='');$('disc').value=0;
    $('rows').innerHTML='';addRow();$('date').valueAsDate=new Date();showDate();
    $('clear').hidden=false;$('confirmClear').hidden=true;
  };
  function fit(){const st=$('stage'),w=st.clientWidth,sc=Math.min(1,w/794);
    $('sheet').style.transform='scale('+sc+')';st.style.height=(1123*sc)+'px'}
  window.addEventListener('resize',fit);fit();
  function showDate(){const v=$('date').value;if(!v){$('dateTxt').textContent='اختر التاريخ';return}
    const [y,m,d]=v.split('-').map(Number);
    const p=x=>String(x).padStart(2,'0');
    $('dateTxt').dir='ltr';$('dateTxt').textContent=p(d)+' / '+p(m)+' / '+y;}
  $('date').addEventListener('change',showDate);$('date').addEventListener('input',showDate);
  $('date').valueAsDate=new Date();showDate();
  function fillSample(){
    $('disc').value=0;$('notes').value='';$('c-name').value='شركة الأمل للتجارة';$('c-person').value='أحمد علي';$('c-email').value='info@alamal.iq';$('c-phone').value='07801234567';
    $('rows').innerHTML='';sample.forEach(addRow);$('date').valueAsDate=new Date();showDate();
    if(EN)swapValues(true);calc();notesState();
  }
  fillSample();
  // Safari can refill fields with old/empty values after load: put the example back
  window.addEventListener('pageshow',e=>{if(e.persisted){calc();return}setTimeout(fillSample,0)});
  try{if(localStorage.getItem('flora-lang')==='en')setLang(true)}catch(e){}
})();
</script>

</body>
</html>
